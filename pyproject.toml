[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2i-cli"
version = "0.4.0"
description = "Command-line interface for the local P2I model explorer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["p2i-core>=0.4,<0.5", "p2i-gui>=0.4,<0.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
p2i = "p2i_cli.main:main"

[project.urls]
Repository = "https://github.com/PtwoI/p2i-cli"

[tool.setuptools.packages.find]
where = ["src"]

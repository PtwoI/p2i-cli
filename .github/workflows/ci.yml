name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: PtwoI/p2i-core
          path: deps/core
      - name: Use matching dependency branch when available (core)
        env:
          P2I_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git -C deps/core fetch origin "$P2I_BRANCH"; then
            git -C deps/core checkout --detach FETCH_HEAD
          fi
      - uses: actions/checkout@v4
        with:
          repository: PtwoI/p2i-gui
          path: deps/gui
      - name: Use matching dependency branch when available (gui)
        env:
          P2I_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git -C deps/gui fetch origin "$P2I_BRANCH"; then
            git -C deps/gui checkout --detach FETCH_HEAD
          fi
      - uses: actions/checkout@v4
        with:
          repository: PtwoI/p2i-sdk
          path: deps/sdk
      - name: Use matching dependency branch when available (sdk)
        env:
          P2I_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git -C deps/sdk fetch origin "$P2I_BRANCH"; then
            git -C deps/sdk checkout --detach FETCH_HEAD
          fi
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ./deps/core -e ./deps/gui -e ./deps/sdk -e . pytest build
      - run: python -m pytest -q tests
      - run: python scripts/verify_install.py
      - run: python -m build
